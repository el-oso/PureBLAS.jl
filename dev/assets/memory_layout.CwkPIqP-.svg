<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" font-family="sans-serif">
<title>A vector and a matrix stored in memory, split into 64-byte cache lines</title>
<rect width="700" height="600" rx="8" fill="#fafafa" stroke="#cfcfcf"/>
<text x="20" y="28" text-anchor="start" font-size="15" fill="#222" font-weight="bold">A. A vector of 8 Float64 numbers is 64 bytes, exactly one cache line</text>
<rect x="42" y="46" width="72" height="38" fill="#cfe2f3" stroke="#555" stroke-width="1.5"/>
<text x="78.0" y="70" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">x[1]</text>
<text x="78.0" y="102" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">byte 0</text>
<rect x="114" y="46" width="72" height="38" fill="#cfe2f3" stroke="#555" stroke-width="1.5"/>
<text x="150.0" y="70" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">x[2]</text>
<text x="150.0" y="102" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">byte 8</text>
<rect x="186" y="46" width="72" height="38" fill="#cfe2f3" stroke="#555" stroke-width="1.5"/>
<text x="222.0" y="70" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">x[3]</text>
<text x="222.0" y="102" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">byte 16</text>
<rect x="258" y="46" width="72" height="38" fill="#cfe2f3" stroke="#555" stroke-width="1.5"/>
<text x="294.0" y="70" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">x[4]</text>
<text x="294.0" y="102" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">byte 24</text>
<rect x="330" y="46" width="72" height="38" fill="#cfe2f3" stroke="#555" stroke-width="1.5"/>
<text x="366.0" y="70" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">x[5]</text>
<text x="366.0" y="102" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">byte 32</text>
<rect x="402" y="46" width="72" height="38" fill="#cfe2f3" stroke="#555" stroke-width="1.5"/>
<text x="438.0" y="70" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">x[6]</text>
<text x="438.0" y="102" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">byte 40</text>
<rect x="474" y="46" width="72" height="38" fill="#cfe2f3" stroke="#555" stroke-width="1.5"/>
<text x="510.0" y="70" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">x[7]</text>
<text x="510.0" y="102" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">byte 48</text>
<rect x="546" y="46" width="72" height="38" fill="#cfe2f3" stroke="#555" stroke-width="1.5"/>
<text x="582.0" y="70" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">x[8]</text>
<text x="582.0" y="102" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">byte 56</text>
<text x="330" y="124" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">each cell = one Float64 = 8 bytes</text>
<text x="20" y="168" text-anchor="start" font-size="15" fill="#222" font-weight="bold">B. A 4 × 4 matrix, as you draw it</text>
<rect x="60" y="184" width="40" height="40" fill="#8ab4f8" stroke="#555" stroke-width="1.5"/>
<text x="80.0" y="209" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">1,1</text>
<rect x="60" y="224" width="40" height="40" fill="#8ab4f8" stroke="#555" stroke-width="1.5"/>
<text x="80.0" y="249" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">2,1</text>
<rect x="60" y="264" width="40" height="40" fill="#8ab4f8" stroke="#555" stroke-width="1.5"/>
<text x="80.0" y="289" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">3,1</text>
<rect x="60" y="304" width="40" height="40" fill="#8ab4f8" stroke="#555" stroke-width="1.5"/>
<text x="80.0" y="329" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">4,1</text>
<rect x="100" y="184" width="40" height="40" fill="#f6b26b" stroke="#555" stroke-width="1.5"/>
