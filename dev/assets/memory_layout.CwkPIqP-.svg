<rect x="460" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<rect x="480" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<rect x="500" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<rect x="520" y="512" width="20" height="24" fill="#e06666" stroke="#555" stroke-width="1"/>
<rect x="540" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<rect x="560" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<rect x="580" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<rect x="600" y="512" width="20" height="24" fill="#e06666" stroke="#555" stroke-width="1"/>
<rect x="620" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<rect x="640" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<rect x="660" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
<line x1="520" y1="508" x2="520" y2="540" stroke="#990000" stroke-width="2.5"/>
<rect x="320" y="558" width="12" height="12" fill="#6aa84f" stroke="#555" stroke-width="1"/>
<text x="337" y="568" text-anchor="start" font-size="10" fill="#555" font-weight="normal">number used</text>
<rect x="420" y="558" width="12" height="12" fill="#d9ead3" stroke="#555" stroke-width="1"/>
<text x="437" y="568" text-anchor="start" font-size="10" fill="#555" font-weight="normal">fetched, not used</text>
<rect x="540" y="558" width="12" height="12" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="557" y="568" text-anchor="start" font-size="10" fill="#555" font-weight="normal">never fetched</text>
<text x="20" y="584" text-anchor="start" font-size="12" fill="#555" font-weight="normal">Julia (like Fortran and BLAS) stores matrices column-major, so reading down a column is the cheap direction.</text>
</svg>
