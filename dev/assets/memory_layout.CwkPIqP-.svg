<rect x="100" y="264" width="40" height="40" fill="#f6b26b" stroke="#555" stroke-width="1.5"/>
<text x="120.0" y="289" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">3,2</text>
<rect x="100" y="304" width="40" height="40" fill="#f6b26b" stroke="#555" stroke-width="1.5"/>
<text x="120.0" y="329" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">4,2</text>
<rect x="140" y="184" width="40" height="40" fill="#93c47d" stroke="#555" stroke-width="1.5"/>
<text x="160.0" y="209" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">1,3</text>
<rect x="140" y="224" width="40" height="40" fill="#93c47d" stroke="#555" stroke-width="1.5"/>
<text x="160.0" y="249" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">2,3</text>
<rect x="140" y="264" width="40" height="40" fill="#93c47d" stroke="#555" stroke-width="1.5"/>
<text x="160.0" y="289" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">3,3</text>
<rect x="140" y="304" width="40" height="40" fill="#93c47d" stroke="#555" stroke-width="1.5"/>
<text x="160.0" y="329" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">4,3</text>
<rect x="180" y="184" width="40" height="40" fill="#d5a6bd" stroke="#555" stroke-width="1.5"/>
<text x="200.0" y="209" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">1,4</text>
<rect x="180" y="224" width="40" height="40" fill="#d5a6bd" stroke="#555" stroke-width="1.5"/>
<text x="200.0" y="249" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">2,4</text>
<rect x="180" y="264" width="40" height="40" fill="#d5a6bd" stroke="#555" stroke-width="1.5"/>
<text x="200.0" y="289" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">3,4</text>
<rect x="180" y="304" width="40" height="40" fill="#d5a6bd" stroke="#555" stroke-width="1.5"/>
<text x="200.0" y="329" text-anchor="middle" font-size="12" fill="#222" font-weight="normal">4,4</text>
<text x="140" y="364" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">cell "row,column"; color = column</text>
<text x="250" y="210" text-anchor="start" font-size="14" fill="#222" font-weight="bold">C. The same numbers in memory, column by column</text>
<rect x="250" y="226" width="26" height="40" fill="#8ab4f8" stroke="#555" stroke-width="1"/>
<text x="263.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">1,1</text>
<rect x="276" y="226" width="26" height="40" fill="#8ab4f8" stroke="#555" stroke-width="1"/>
<text x="289.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">2,1</text>
<rect x="302" y="226" width="26" height="40" fill="#8ab4f8" stroke="#555" stroke-width="1"/>
<text x="315.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">3,1</text>
<rect x="328" y="226" width="26" height="40" fill="#8ab4f8" stroke="#555" stroke-width="1"/>
<text x="341.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">4,1</text>
<rect x="354" y="226" width="26" height="40" fill="#f6b26b" stroke="#555" stroke-width="1"/>
<text x="367.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">1,2</text>
<rect x="380" y="226" width="26" height="40" fill="#f6b26b" stroke="#555" stroke-width="1"/>
<text x="393.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">2,2</text>
<rect x="406" y="226" width="26" height="40" fill="#f6b26b" stroke="#555" stroke-width="1"/>
<text x="419.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">3,2</text>
<rect x="432" y="226" width="26" height="40" fill="#f6b26b" stroke="#555" stroke-width="1"/>
<text x="445.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">4,2</text>
<rect x="458" y="226" width="26" height="40" fill="#93c47d" stroke="#555" stroke-width="1"/>
<text x="471.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">1,3</text>
<rect x="484" y="226" width="26" height="40" fill="#93c47d" stroke="#555" stroke-width="1"/>
<text x="497.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">2,3</text>
<rect x="510" y="226" width="26" height="40" fill="#93c47d" stroke="#555" stroke-width="1"/>
<text x="523.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">3,3</text>
<rect x="536" y="226" width="26" height="40" fill="#93c47d" stroke="#555" stroke-width="1"/>
<text x="549.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">4,3</text>
<rect x="562" y="226" width="26" height="40" fill="#d5a6bd" stroke="#555" stroke-width="1"/>
<text x="575.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">1,4</text>
<rect x="588" y="226" width="26" height="40" fill="#d5a6bd" stroke="#555" stroke-width="1"/>
<text x="601.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">2,4</text>
<rect x="614" y="226" width="26" height="40" fill="#d5a6bd" stroke="#555" stroke-width="1"/>
<text x="627.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">3,4</text>
<rect x="640" y="226" width="26" height="40" fill="#d5a6bd" stroke="#555" stroke-width="1"/>
<text x="653.0" y="251" text-anchor="middle" font-size="10" fill="#222" font-weight="normal">4,4</text>
<line x1="458" y1="218" x2="458" y2="296" stroke="#990000" stroke-width="3"/>
<text x="354" y="288" text-anchor="middle" font-size="12" fill="#990000" font-weight="normal">cache line 1: bytes 0–63</text>
<text x="562" y="288" text-anchor="middle" font-size="12" fill="#990000" font-weight="normal">cache line 2: bytes 64–127</text>
<text x="20" y="404" text-anchor="start" font-size="15" fill="#222" font-weight="bold">D. Which cache lines does each kind of read touch?</text>
<text x="440" y="428" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">cache line 1</text>
<text x="600" y="428" text-anchor="middle" font-size="11" fill="#555" font-weight="normal">cache line 2</text>
<text x="20" y="450" text-anchor="start" font-size="13" fill="#222" font-weight="normal">Read column 1  (1,1  2,1  3,1  4,1)</text>
<text x="20" y="470" text-anchor="start" font-size="12" fill="#274e13" font-weight="normal">→ one line fetched, the other never touched</text>
<text x="20" y="486" text-anchor="start" font-size="11" fill="#274e13" font-weight="normal">   (with 8 or more rows, every fetched number is used)</text>
<rect x="360" y="436" width="20" height="24" fill="#6aa84f" stroke="#555" stroke-width="1"/>
<rect x="380" y="436" width="20" height="24" fill="#6aa84f" stroke="#555" stroke-width="1"/>
<rect x="400" y="436" width="20" height="24" fill="#6aa84f" stroke="#555" stroke-width="1"/>
<rect x="420" y="436" width="20" height="24" fill="#6aa84f" stroke="#555" stroke-width="1"/>
<rect x="440" y="436" width="20" height="24" fill="#d9ead3" stroke="#555" stroke-width="1"/>
<rect x="460" y="436" width="20" height="24" fill="#d9ead3" stroke="#555" stroke-width="1"/>
<rect x="480" y="436" width="20" height="24" fill="#d9ead3" stroke="#555" stroke-width="1"/>
<rect x="500" y="436" width="20" height="24" fill="#d9ead3" stroke="#555" stroke-width="1"/>
<rect x="520" y="436" width="20" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<rect x="540" y="436" width="20" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<rect x="560" y="436" width="20" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<rect x="580" y="436" width="20" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<rect x="600" y="436" width="20" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<rect x="620" y="436" width="20" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<rect x="640" y="436" width="20" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<rect x="660" y="436" width="20" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<line x1="520" y1="432" x2="520" y2="464" stroke="#990000" stroke-width="2.5"/>
<text x="20" y="526" text-anchor="start" font-size="13" fill="#222" font-weight="normal">Read row 1  (1,1  1,2  1,3  1,4)</text>
<text x="20" y="546" text-anchor="start" font-size="12" fill="#990000" font-weight="normal">→ both lines fetched, and</text>
<text x="20" y="562" text-anchor="start" font-size="12" fill="#990000" font-weight="normal">   12 of the 16 numbers fetched go unused</text>
<rect x="360" y="512" width="20" height="24" fill="#e06666" stroke="#555" stroke-width="1"/>
<rect x="380" y="512" width="20" height="24" fill="#f4cccc" stroke="#555" stroke-width="1"/>
