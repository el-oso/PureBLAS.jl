[deps]
AllocCheck = "9b6a8646-10ed-4001-bbdc-1d2f46dfbb1a"
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
JET = "c3a54625-cd67-489e-a8e7-0a5a0ff4e31b"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
StrictMode = "0e98b4f4-d0e6-42ac-af0a-707c24852f32"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestItemRunner = "f8b46487-2199-4994-9208-9a1283c18c0a"
TrimCheck = "f940d764-e397-4179-96e0-76ce55cfe39b"

[preferences.StrictMode]
analysis = "full"
checks_enabled = true
fail_mode = "error"

# Freeze ger's panel stream-count so the StrictMode dogfood exercises the SHIPPING path (the .so/trim
# build MUST set this — see src/level2.jl:679). Without it the `@static` auto-cal (OncePerProcess) branch
# compiles in and statically allocates its one-time calibration buffer, reddening the all-paths noalloc
# proof. Value is arbitrary here (any of 1/2/4/8) — the dogfood checks alloc-freeness, not perf.
[preferences.PureBLAS]
ger_panel_np = 4
# Same reason for gemv-T's column-route decision: its OncePerProcess probe allocates a calibration
# buffer, so leaving it unpinned reddens the same all-paths noalloc proof (trmv! reaches gemv-T).
# `false` = the always-blocked shipping arm. Value is arbitrary for this job -- the dogfood checks
# alloc-freeness, not perf -- and pinning is legitimate here precisely because the CI runner is known
# hardware; real users on unknown hardware still auto-measure.
gemvt_perscan = false
# AND the gemv-T COLUMN COUNT, which was missing and left the whole BLAS-2 dogfood item ERRORING.
# `_measure_gemvt_nc`'s `@static if isnothing(pref)` branch keeps a `Base.OncePerProcess` tuner
# reachable from `gemv!`, whose one-time init allocates; AllocCheck proves ALL paths, so one reachable
# tuner reddens the entire item. A red item is worse than no item: it looks like coverage and proves
# nothing. This gap let an allocation regression (an `ntuple` closure boxing in `_gemv_t_block!`'s
# caller, 28x on the Zen5 gate) reach master through a guard that was *designed* to catch exactly it.
# 4 is the shipping value; the dogfood checks alloc-freeness, not perf.
gemvt_nc = 4
# And the three FORCE-HOOK resolvers. These were the ones that actually kept the item red: unlike
# `gemvt_nc` they built their `OncePerProcess` UNCONDITIONALLY, so a pin overrode the value but did not
# remove the resolver from the all-paths proof. They are now `@static if isnothing(pref)`-gated, and
# pinning here compiles them out entirely. Values are the shipping defaults.
gemvt_u = 1
gemvt_pf = 0
trmv_fused_min = 1
gemvt_deep = true
# `gemvn_minner` was MISSING from this list (added 2026-08-16) — the exact omission the paragraph above
# warns about, and it is what reddened the BLAS-2 @typestable item on Julia 1.13. Unpinned, the
# `@static if isnothing(_GEMVN_MINNER_PREF)` branch keeps a `Base.OncePerProcess` reachable from
# `gemv!`, whose first-call `lock()` descends through `yield()`/`wait()` into Base's
# `OncePerThread{Task}` scheduler — which JET reports as "failed to optimize due to recursion". Nothing
# in PureBLAS is unstable there; the fix is to stop compiling the resolver in at all. `false` is the
# value juliac/build.jl:116 already pins for the trim build, so the dogfood exercises the shipping
# configuration; the item checks type-stability, not which arm is faster.
gemvn_minner = false
# ── THE REMAINING MEASURE-TIER KNOBS ────────────────────────────────────────────────────────────────
# Every knob whose `@static if isnothing(pref)` branch builds a `Base.OncePerProcess` MUST be pinned
# here, or its one-time init (jl_set_precompile_field_replace) stays reachable and reddens any
# all-paths AllocCheck proof that can reach it. Nine were missing, and they are exactly why three
# dogfood items were erroring: `cgemvt_cfg` (BLAS-2, via complex gemv-T) and the LAPACK set below.
# Values are the SAME ones juliac/build.jl already pins for the trim build, so the dogfood exercises
# the shipping configuration rather than an invented one. test/req8_lint.jl guards the list.
cgemvt_cfg = 4
brd_nb = 8
gbtrf_cross = 16
pbtrf_cross_kd = 32
pbtrf_nb = 40
pbtrf_nb_small = 8
pbtrf_u_native_kd = 256
potrf_upper_direct_max = 12
pptrf_spr_min = 8

# Same again for the complex-axpy width decision: its OncePerProcess probe allocates a calibration
# buffer, which reddens the same all-paths noalloc proof. `true` = the narrow arm (the Zen4 optimum and
# the shipping path here); the dogfood checks alloc-freeness, not perf.
zaxpy_narrow = true
# And the two REAL-axpy shape knobs, for the identical reason: each is a Measure-tier OncePerProcess
# whose one-time init provably allocates (jl_set_precompile_field_replace, lock.jl:725), and `trmv!`
# reaches `_axpy_simd!` per column (level2.jl:1661), so leaving them unpinned reddens the BLAS-2
# all-paths noalloc proof — which is exactly how this surfaced. Values mirror juliac/build.jl so the
# dogfood proves the same shipping path the .so ships; the dogfood checks alloc-freeness, not perf, and
# bench/gate runs use the main (unpinned) env, so the Measure tier still auto-measures for real users.
# Arm CORRECTNESS is covered directly by the "axpy shape arms" testitem, not by whatever these pin to.
axpy_unroll = 4
axpy_dram = 4
