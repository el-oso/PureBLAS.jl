name: CI
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Parallel jobs run DISJOINT slices of the suite (PUREBLAS_TEST_GROUP/SHARD, read by test/runtests.jl):
  # `test` shards the correctness suite across 2 runners (with coverage → Coveralls parallel build);
  # `checks` runs only the inference-heavy dogfood (StrictMode strict contracts, TrimCheck trim-safety,
  # Aqua) tagged `:checks`. Every testitem still runs — the split is scheduling only (wall-clock ≈ the
  # slowest slice). Local `Pkg.test()` (no env) runs the FULL suite unchanged.
  test:
    name: Julia ${{ matrix.version }} - main (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # The suite uses TrimCheck (Julia 1.12 `Compiler` stdlib), JET, StrictMode, ForwardDiff — pinned to
    # 1.12 (nightly dropped: compiler-internals churn broke it and it added no signal).
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          PUREBLAS_TEST_GROUP: main
          PUREBLAS_SHARD: ${{ matrix.shard }}
          PUREBLAS_NSHARDS: '2'
      - uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Coveralls (parallel)
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
          flag-name: main-${{ matrix.shard }}
          parallel: true
          fail-on-error: false

  coverage-finish:
    name: Coveralls finish
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Close the Coveralls parallel build
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: "main-1,main-2"
          fail-on-error: false

  checks:
    name: Julia 1.12 - trim/strict/aqua checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Inference/trim-safety dogfood — no line coverage (these exercise the SAME kernels the `test` job
      # already covers functionally; they assert type-stability/no-alloc/trim-safety, not new surface).
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
        env:
          PUREBLAS_TEST_GROUP: checks

  # AUTHORITATIVE trim gate: actually build libpureblas.so via juliac --trim=safe. The `checks` job's
  # StrictMode @assert_trim_compatible + TrimCheck @validate are dev-time HEURISTICS that miss the
  # reachability-limit union-splits juliac catches (a green suite once shipped a non-building .so — the
  # complex-F32 LAPACK variants union-split geqrf!'s muladd). This is the only check that proves the .so
  # links for non-Julia hosts (req #4). Runs on 1.12 (juliac --trim is a 1.12 Compiler-stdlib feature).
  trim-so:
    name: Julia 1.12 - juliac --trim .so build (authoritative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build libpureblas.so (juliac --trim=safe --compile-ccallable)
        run: julia --project=. juliac/build.jl

      # BUILDING THE .so IS NOT THE SAME AS THE .so WORKING. The step above catches trim-verifier and
      # link failures; it cannot catch a library that builds cleanly and is then unusable — wrong symbol
      # decoration, a broken Fortran C-ABI, or the embedded runtime failing to self-init on first call.
      # `juliac/ctest.c` is the only check that dlopens the artifact and calls THROUGH that ABI from a
      # real C host, which is the entire point of shipping a .so for non-Julia consumers.
      #
      # It lived only in `test/juliac_build_test.jl`, gated behind PUREBLAS_JULIAC_BUILD=1 because that
      # testitem re-runs the ~13-minute build itself. CI therefore never ran it, and ROADMAP.md listed
      # "close before tagging" as an open item. Reusing the .so this job just built makes it seconds
      # instead of a second build, so it runs on every push rather than only at a tag.
      - name: C-host LBT smoke — ctest.c against the freshly built .so
        run: |
          set -euo pipefail
          cc -O2 juliac/ctest.c -o /tmp/ctest -ldl -lm
          # run from the repo root: ctest.c dlopens juliac/build/libpureblas.so by RELATIVE path
          out=$(/tmp/ctest)
          echo "$out"
          grep -q 'daxpy: 12.0 24.0 36.0 48.0' <<<"$out" || { echo "FAIL: daxpy through the C-ABI"; exit 1; }
          grep -q 'dgesvd: info=0'              <<<"$out" || { echo "FAIL: dgesvd info"; exit 1; }
          grep -q 'dgesvd n=160: info=0'        <<<"$out" || { echo "FAIL: dgesvd n=160 info"; exit 1; }
          # Both SVD reconstructions must reach machine precision THROUGH the C-ABI — an ABI that passes
          # arguments subtly wrongly can still return info=0 while computing nonsense.
          recon=$(sed -n 's/.*dgesvd n=160:.*recon|err|=\([0-9.eE+-]*\).*/\1/p' <<<"$out")
          ortho=$(sed -n 's/.*dgesvd n=160:.*ortho|err|=\([0-9.eE+-]*\).*/\1/p' <<<"$out")
          awk -v r="$recon" -v o="$ortho" 'BEGIN{
                if (r == "" || o == "") { print "FAIL: could not parse recon/ortho errors"; exit 1 }
                if (r+0 >= 1e-9 || o+0 >= 1e-9) { printf "FAIL: precision recon=%s ortho=%s\n", r, o; exit 1 }
                printf "  C-ABI precision OK: recon=%s ortho=%s\n", r, o }'

  # The ONE artifact check that can run here. Everything else in the publish gate
  # (bench/check_artifacts_current.sh) rebuilds the plots from bench/plots_data_*.txt, which are
  # gitignored and never pushed — CI has no caches, so it cannot judge whether a plot matches its data.
  # It CAN judge that the two reference views moved together, which is the failure that shipped: the
  # OpenBLAS SVGs sat at bdb9497 while the AOCL set was re-rendered three times.
  artifact-pairing:
    name: Perf plot views paired (OpenBLAS ⟷ AOCL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needs the base commit to diff against
      - name: Both reference views changed together
        run: |
          base='${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'
          case "$base" in ''|0000000000000000000000000000000000000000) echo "no base commit to diff (first push) — skipping"; exit 0 ;; esac
          git diff --name-only "$base" '${{ github.sha }}' | bench/check_view_pairing.sh

  perf:
    name: Perf regression (PkgBenchmark judge)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # judge checks out the PR base ref → needs full history
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Blocks the merge on a >25% slowdown vs the base branch (coarse: shared runners are noisy — see
      # benchmark/judge_ci.jl). Precise 0.96× OpenBLAS gating runs on a pinned self-hosted fleet runner.
      - name: Judge performance vs base branch
        run: julia --project=benchmark benchmark/judge_ci.jl
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
