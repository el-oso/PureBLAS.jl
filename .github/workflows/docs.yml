name: Documentation
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  statuses: write
  pull-requests: write
# deps/build.jl times the host's idle-state onset whenever Pkg builds PureBLAS; not wanted on a runner.
env:
  PUREBLAS_SKIP_BUILD_TUNE: '1'
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Record CPU model for the cache key
        run: echo "CPU_MODEL=$(lscpu | awk -F': *' '/^Model name/{print $2; exit}' | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_ENV"
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu_model=${{ env.CPU_MODEL }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
