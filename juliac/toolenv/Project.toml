# Build-tool environment for the `juliac --trim` .so build. Deliberately SEPARATE from the package's
# own Project.toml: JuliaC is a build tool, not a dependency of PureBLAS, and the shipped package must
# not gain a dep for it.
#
# WHY IT EXISTS AT ALL. Julia ships no juliac driver: share/julia/test/trimming/juliac-*.jl are test
# fixtures, not an entry point. The driver is the registered package JuliaC.jl (JuliaLang/JuliaC.jl),
# and `juliac/build.jl` runs it out of this environment.
[deps]
JuliaC = "acedd4c2-ced6-4a15-accc-2607eb759ba2"

[compat]
JuliaC = "0.3"
julia = "1.13"
