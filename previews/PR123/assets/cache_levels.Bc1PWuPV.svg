<text x="20" y="122" text-anchor="start" font-size="12" fill="#555" font-weight="normal">32 vector registers × 64 B = 2 KiB</text>
<text x="250" y="122" text-anchor="start" font-size="12" fill="#555" font-weight="normal">256 numbers   (a 16 × 16 matrix)</text>
