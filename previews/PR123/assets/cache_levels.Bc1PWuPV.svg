<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="sans-serif">
<title>Cache levels as rows of 64-byte lines, with capacities</title>
<defs><marker id="dn" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<rect width="700" height="500" rx="8" fill="#fafafa" stroke="#cfcfcf"/>
<text x="20" y="28" text-anchor="start" font-size="14" fill="#222" font-weight="bold">Each level holds copies of 64-byte lines. Sizes are from the machine used for these docs.</text>
<text x="20" y="46" text-anchor="start" font-size="12" fill="#555" font-weight="normal">Rows are not to scale: the multiplier between rows says how many times more lines the next level holds.</text>
<text x="20" y="98" text-anchor="start" font-size="15" fill="#222" font-weight="bold">Registers</text>
<rect x="140" y="70" width="14" height="36" fill="#ea9999" stroke="#555" stroke-width="1"/>
<rect x="154" y="70" width="14" height="36" fill="#ea9999" stroke="#555" stroke-width="1"/>
<rect x="168" y="70" width="14" height="36" fill="#ea9999" stroke="#555" stroke-width="1"/>
