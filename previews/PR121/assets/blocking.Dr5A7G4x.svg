<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="sans-serif" font-size="13">
  <title>Matrix multiply split into blocks that fit each cache level</title>
  <rect width="600" height="420" rx="8" fill="#fafafa" stroke="#cfcfcf"/>
  <g fill="#ffffff" stroke="#555" stroke-width="1.5">
    <rect x="20" y="40" width="150" height="150"/>
    <rect x="215" y="40" width="150" height="150"/>
    <rect x="410" y="40" width="150" height="150"/>
  </g>
  <g fill="#222" text-anchor="middle" font-size="15">
    <text x="95" y="28">A  (m × k)</text>
    <text x="290" y="28">B  (k × n)</text>
    <text x="485" y="28">C  (m × n)</text>
    <text x="192" y="120" font-size="26">×</text>
    <text x="387" y="120" font-size="26">=</text>
  </g>
  <!-- 1  L3: block of B, kc rows by nc columns (nc narrower than n so a "next block" exists) -->
  <rect x="215" y="40" width="120" height="60" fill="#8ab4f8" fill-opacity="0.75" stroke="#1a56c4" stroke-width="1.5"/>
  <text x="290" y="78" text-anchor="middle" font-size="12" fill="#0b2d6b">kc × nc</text>
  <!-- 2  L2: block of A, mc rows by kc columns (kc matches the B block's height) -->
  <rect x="20" y="80" width="60" height="50" fill="#f6b26b" fill-opacity="0.85" stroke="#b45f06" stroke-width="1.5"/>
  <text x="50" y="121" text-anchor="middle" font-size="12" fill="#5a2e00">mc × kc</text>
  <!-- 3  L1: strip of B, kc rows by NR columns -->
  <rect x="215" y="40" width="30" height="60" fill="#6aa84f" fill-opacity="0.9" stroke="#274e13" stroke-width="1.5"/>
  <!-- rows of C the A block updates (mc rows by nc columns) -->
  <rect x="410" y="80" width="120" height="50" fill="#d9d9d9" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
  <!-- 4  registers: tile of C (MR × NR), and the MR × kc strip of A that feeds it -->
  <rect x="410" y="80" width="30" height="14" fill="#e06666" stroke="#990000" stroke-width="1.5"/>
  <rect x="20" y="80" width="60" height="14" fill="none" stroke="#990000" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="446" y="91" font-size="11" fill="#990000">◀ MR × NR</text>
  <!-- loop-nesting badges: 1 outermost, 4 innermost -->
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#222">
    <circle cx="209" cy="34" r="9" fill="#fff" stroke="#1a56c4" stroke-width="1.5"/><text x="209" y="38">1</text>
    <circle cx="14" cy="74" r="9" fill="#fff" stroke="#b45f06" stroke-width="1.5"/><text x="14" y="78">2</text>
    <circle cx="230" cy="110" r="9" fill="#fff" stroke="#274e13" stroke-width="1.5"/><text x="230" y="114">3</text>
    <circle cx="404" cy="74" r="9" fill="#fff" stroke="#990000" stroke-width="1.5"/><text x="404" y="78">4</text>
  </g>
  <!-- legend, outermost loop first -->
  <g fill="#222">
    <circle cx="38" cy="229" r="9" fill="#8ab4f8" stroke="#1a56c4" stroke-width="1.5"/><text x="38" y="233" text-anchor="middle" font-size="11" font-weight="bold">1</text>
    <text x="54" y="233">L3 cache: a block of B (kc × nc). Stays put while every row block of A passes by.</text>
    <circle cx="38" cy="253" r="9" fill="#f6b26b" stroke="#b45f06" stroke-width="1.5"/><text x="38" y="257" text-anchor="middle" font-size="11" font-weight="bold">2</text>
    <text x="54" y="257">L2 cache: a block of A (mc × kc). Stays put while every strip of the B block passes by.</text>
    <circle cx="38" cy="277" r="9" fill="#6aa84f" stroke="#274e13" stroke-width="1.5"/><text x="38" y="281" text-anchor="middle" font-size="11" font-weight="bold">3</text>
    <text x="54" y="281">L1 cache: a strip of B (kc × NR). Stays put while every row strip of A passes by.</text>
    <circle cx="38" cy="301" r="9" fill="#e06666" stroke="#990000" stroke-width="1.5"/><text x="38" y="305" text-anchor="middle" font-size="11" font-weight="bold">4</text>
    <text x="54" y="305">Registers: a tile of C (MR × NR) = dashed red A strip × green B strip, summed over kc.</text>
    <rect x="30" y="316" width="16" height="16" fill="#d9d9d9" stroke="#666"/>
    <text x="54" y="329">Gray: the rows of C the A block updates, one tile at a time.</text>
  </g>
  <g fill="#555" font-size="12">
    <text x="30" y="362">Loop order: 1 is the outermost loop, 4 the innermost.</text>
    <text x="30" y="382">On this machine: kc = 384, mc = 96, nc = 1360; tile MR × NR = 2 × 8 (16 rows × 8 columns).</text>
  </g>
</svg>
